<style>
:root{
  --bg:#f6f2ec; --panel:#fffdfa; --ink:#242424; --muted:#6d6a66; --line:#e4dace;
  --accent:#2f75c8; --accent-weak:#e8f2ff; --green:#2c8a54; --green-weak:#e8f7ed;
  --yellow:#8a610a; --yellow-weak:#fff3cf; --red:#bd4a4a; --red-weak:#fff0f0;
  --chip:#eef3fa; --shadow:0 12px 28px rgba(40,32,20,.08); --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:linear-gradient(180deg,#fbfaf6,var(--bg));font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#152238;color:#fff;padding:20px 16px;overflow:auto}
.logo{font-weight:900;font-size:23px;letter-spacing:.02em;line-height:1.2}
.sub{font-size:12px;color:#c7d5eb;margin:7px 0 15px}
.nav button{width:100%;display:block;background:transparent;border:0;color:#e8f1ff;text-align:left;padding:9px 11px;border-radius:11px;cursor:pointer;margin:2px 0;font-size:14px;line-height:1.4}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.13)}
.navSpacer{height:10px}
.sidebox{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px 11px;margin-top:12px;font-size:11px;line-height:1.65;color:#d9e5f5}
.main{padding:24px 28px 50px;min-width:0}
.topStack{position:sticky;top:12px;z-index:7;display:grid;gap:10px;margin-bottom:18px}.topbar{position:relative;background:rgba(255,253,250,.96);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 26px rgba(40,32,20,.09);display:grid;gap:12px;padding:14px;backdrop-filter:blur(10px)}
.topKpiSlot{display:none;margin-bottom:14px}
.topKpiSlot.show{display:block}
.topKpiSlot .kpis{margin:0}
.topRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;min-width:0}
.toolRow{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,220px);gap:12px;align-items:end;min-width:0}
.searchbar{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.searchbar input{flex:1;min-width:160px}
.input, input[type="text"], input[type="number"], input[type="date"], textarea{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px;outline:none}
.input:focus,input:focus,textarea:focus{border-color:#9fbfe2;box-shadow:0 0 0 3px rgba(47,117,200,.12)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-end}
.btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.03);white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:#bdd0e5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:#fff4f4;border-color:#f2c7c7;color:#aa3333}
.btn.ghost{box-shadow:none;background:transparent}
.btn.small{padding:6px 9px;font-size:12px}
.hidden{display:none!important}
.pendingBar{display:none;align-items:center;justify-content:space-between;gap:12px;background:#fff8de;border:1px solid #ead38d;color:#654b03;border-radius:14px;padding:10px 12px;margin:0;position:relative;z-index:6;box-shadow:0 8px 20px rgba(40,32,20,.08)}
.pendingBar.show{display:flex}
.pendingBar .pendingMsg{font-weight:800;font-size:13px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{font-size:25px;margin:0 0 7px}
.hero p{margin:0;color:var(--muted);line-height:1.65}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.kpi .num{font-size:26px;font-weight:900}
.kpi .label{font-size:12px;color:var(--muted);margin-top:3px}
.kpi .hint{font-size:11px;color:#8a8379;margin-top:6px;line-height:1.35}
.heroHead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.heroActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.metricModal{width:min(900px,100%)}
.metricManage{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1fr);gap:14px}
.metricList{display:grid;gap:8px;margin-top:9px}
.metricRow{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;background:#fbf7ef;border:1px solid #eee0ce;border-radius:12px;padding:9px;cursor:grab;user-select:none}
.metricRow.dragging{opacity:.45}
.metricRow.dropBefore,.metricRow.dropAfter{position:relative}
.metricRow.dropBefore::before,.metricRow.dropAfter::after{content:"";position:absolute;left:8px;right:8px;height:4px;background:#2f75c8;border-radius:999px;box-shadow:0 0 0 4px rgba(47,117,200,.14);pointer-events:none}
.metricRow.dropBefore::before{top:-8px}
.metricRow.dropAfter::after{bottom:-8px}
.metricCatalog{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.metricChip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:12px}
.metricChip:hover{border-color:#bdd0e5}
.metricChip.disabled{opacity:.45;cursor:default;background:#f3f0eb}
.metricDesc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px}
.section{margin:25px 0 36px}
.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
h2{font-size:21px;margin:0}
.note{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);overflow:visible;position:relative}
.card.created{border-color:#ffd99a}
.card.pro{border-color:#bae6c9}
.favoriteBtn{position:absolute;right:12px;top:12px;z-index:3;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.9);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:22px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.10);color:#a7a29a}
.favoriteBtn.selected{color:#e4a100;background:#fff8d8;border-color:#f0d681}
.thumb{height:158px;border-radius:15px;background:#eee5db;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#8b8175;font-weight:800;margin-bottom:10px}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fafafa}
.name{font-size:16px;font-weight:900;line-height:1.35;padding-right:36px}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.cardSummary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 4px}
.summaryItem{background:#f8f4ed;border:1px solid #ece1d5;border-radius:12px;padding:8px;color:#2b261f;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.summaryItem .summaryLabel{font-size:10px;color:var(--summary-label-color, rgba(43,38,31,.65));font-weight:800;margin-bottom:2px}
.summaryItem .summaryValue{font-size:13px;font-weight:900;line-height:1.35}
.summaryItem.starSummary,.summaryItem.positionSummary{transition:background .2s ease,border-color .2s ease,color .2s ease}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.tag{font-size:11px;border-radius:999px;padding:4px 8px;background:var(--chip);color:#314d68}
.tag.pro{background:var(--green-weak);color:#1e6d3b}
.tag.no{background:var(--yellow-weak);color:#7c550b}
.tag.blank{background:#eee;color:#666}
.tag.manual{background:#f0e9ff;color:#5c368f}
.tag.star{background:#fff0d7;color:#8a4e00}
.tag.favorite{background:#fff6cb;color:#856100}
.tag.re{background:#ffe8ef;color:#9e2b55}
.tags .tag{background:#efe5d6!important;color:#6f5739!important;border:1px solid #dcccb8!important}
.editBox{border-top:1px dashed #e7ded3;margin-top:10px;padding-top:10px}
.editBox > summary{cursor:pointer;color:#315f91;font-weight:900;font-size:13px;list-style:none}
.editBox > summary::-webkit-details-marker{display:none}
.editBox > summary:before{content:'▶';font-size:10px;margin-right:6px}
.editBox[open] > summary:before{content:'▼'}
.controls{margin-top:10px;display:grid;gap:9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px}
.field{min-width:0}
.field input{width:100%}
.choice{position:relative}
.choiceBtn{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.choiceBtn:after{content:"▼";font-size:10px;color:#777}
.choiceMenu{display:none;position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #9dc0e6;border-radius:12px;box-shadow:0 12px 35px rgba(35,45,65,.18);overflow:hidden;max-height:260px;overflow-y:auto}
.choice.open .choiceMenu{display:block}
.choiceMenu button{display:block;width:100%;padding:10px 12px;border:0;border-bottom:1px solid #e8f0f8;background:#fff;text-align:left;cursor:pointer}
.choiceMenu button:hover,.choiceMenu button.selected{background:#d7ebff}
.choiceMenu .addChoice{font-weight:800;background:#fff9e8;color:#79510b}

.topControls{align-items:flex-end;flex-wrap:wrap;min-width:0}
.topField{display:grid;gap:5px;min-width:150px}
.topLabel{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.04em}
.searchField{min-width:0;max-width:none}
.topActions{margin-left:0;align-self:end}
.sortField{min-width:0}
.sortBar{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.sortPills{display:flex;gap:7px;flex-wrap:wrap;align-items:center;max-width:100%}
.sortPill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.sortPill.selected{background:var(--accent);border-color:var(--accent);color:#fff}
.filterField{min-width:0}
.filterField .btn{width:100%}
.filterSummary{font-size:12px;color:#5f5b56;margin-top:6px;line-height:1.6}
.filterModal{width:min(980px,100%)}
.filterTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.filterSections{display:grid;gap:14px}
.filterGroup{background:#fffaf3;border:1px solid var(--line);border-radius:18px;padding:13px}
.filterGroupTitle{font-size:14px;font-weight:900;margin-bottom:9px}
.filterChips{display:flex;gap:8px;flex-wrap:wrap}
.filterChip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:12px}
.filterChip.selected{background:var(--accent);border-color:var(--accent);color:#fff}
.filterMode .pillBtn.selected{background:#152238;border-color:#152238;color:#fff}
.groupBlock{margin:0 0 28px}
.groupTitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.groupTitle h3{font-size:20px;margin:0}
.sortBadge{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 9px}

.tagManageList{display:grid;gap:10px;margin-top:12px;max-width:560px}
.tagManageRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px}
.tagManageRow input{width:100%}
.schoolPicker{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.schoolPicker .pillBtn{font-weight:800}
.schoolPicker .pillBtn.selected{background:var(--yellow-weak);border-color:#e0be78;color:#78530d}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pillBtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:12px}
.pillBtn.selected{background:var(--accent);border-color:var(--accent);color:#fff}
.pillBtn.proSel{background:var(--green);border-color:var(--green);color:#fff}
.pillBtn.noSel{background:#e8a83b;border-color:#e8a83b;color:#fff}
.pillBtn.add{background:#fff9e8;border-color:#ead3a5;color:#7b550e;font-weight:800}
.pillBtn.reSel{background:#d65a83;border-color:#d65a83;color:#fff}
.memo{min-height:56px;resize:vertical;width:100%}
.imageTools{display:grid;gap:6px}
.imageTools input[type="file"]{font-size:12px;max-width:100%}
.empty{padding:26px;background:#fff;border:1px dashed #d9d0c4;border-radius:18px;text-align:center;color:#777}
.yearBlock{margin-bottom:30px}
.tableWrap{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:auto}
.table{border-collapse:collapse;width:100%;font-size:13px}
.table th,.table td{padding:10px;border-bottom:1px solid #eee;vertical-align:middle;text-align:left}
.table th{background:#fbf6ed;position:sticky;top:0;z-index:2}
.smallThumb{width:46px;height:46px;border-radius:11px;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#777;font-size:10px}
.smallThumb img{width:100%;height:100%;object-fit:cover}
.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formGrid .wide{grid-column:1/-1}
.modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.34);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.modal{background:#fff;width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:24px;box-shadow:0 20px 70px rgba(0,0,0,.26);padding:18px}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modalHead h2{margin:0}
.close{border:0;background:#f1f1f1;border-radius:12px;padding:8px 10px;cursor:pointer}
.backupBox{white-space:pre-wrap;background:#151a22;color:#e8f0ff;border-radius:16px;padding:14px;max-height:320px;overflow:auto;font-size:12px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.footerNote{font-size:12px;color:var(--muted);line-height:1.7;margin-top:18px}
.separator{height:1px;background:var(--line);margin:16px 0}
.workName{font-size:12px;color:#6d6a66;margin-top:4px}
.identityLine{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding-right:4px}
.identityLine .workName{margin-top:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modeBadge{font-size:11px;font-weight:900;border-radius:999px;padding:4px 8px;background:#f6efe4;color:#6d542f;border:1px solid #eadcca;white-space:nowrap}
.modeBadge.uncreated{background:#eee;color:#666;border-color:#ddd}
.modeBadge.success{background:#e8f7ed;color:#1e6d3b;border-color:#c7e9d4}
.modeBadge.powerfes{background:#fff0d7;color:#8a4e00;border-color:#efcf99}
.modeBadge.legend{background:#f0e9ff;color:#5c368f;border-color:#d8c5f5}
.modeBadge.eikan{background:#e2f5ff;color:#236c8d;border-color:#bde6f8}
.priorityManage{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.priorityBox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.priorityList{display:grid;gap:8px;margin-top:9px}
.priorityRow{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;background:#fbf7ef;border:1px solid #eee0ce;border-radius:12px;padding:9px;cursor:grab;user-select:none}
.priorityRow.dragging{opacity:.45}
.priorityRow.dropBefore,.priorityRow.dropAfter{position:relative}
.priorityRow.dropBefore::before,.priorityRow.dropAfter::after{content:"";position:absolute;left:8px;right:8px;height:4px;background:#2f75c8;border-radius:999px;box-shadow:0 0 0 4px rgba(47,117,200,.14);pointer-events:none}
.priorityRow.dropBefore::before{top:-8px}
.priorityRow.dropAfter::after{bottom:-8px}
.dragHandle{font-size:21px;line-height:1;color:#6e6359;padding:0 3px;cursor:grab}
.debutManagePanel{display:grid;gap:14px}
.workSelectPanel{display:flex;gap:8px;flex-wrap:wrap}
.debutList{display:grid;gap:8px;max-width:760px}
.debutRow{display:grid;grid-template-columns:auto auto 52px minmax(0,1fr);gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px;cursor:grab}
.debutRow.dragging{opacity:.45}
.debutRow.dropBefore,.debutRow.dropAfter{position:relative}
.debutRow.dropBefore::before,.debutRow.dropAfter::after{content:"";position:absolute;left:8px;right:8px;height:4px;background:#2f75c8;border-radius:999px;box-shadow:0 0 0 4px rgba(47,117,200,.14);pointer-events:none}
.debutRow.dropBefore::before{top:-8px}
.debutRow.dropAfter::after{bottom:-8px}
.debutOrderBadge{font-size:12px;font-weight:900;color:#6a5c4b;background:#f6efe4;border-radius:999px;padding:5px 8px;text-align:center}
.priorityName{font-weight:800;font-size:13px}
.positionLogic{margin-top:10px;background:#fff;border:1px dashed #d9cbb8;border-radius:14px;padding:10px}

.positionFilterPanel{background:#fff;border:1px solid #eadcca;border-radius:18px;padding:14px;display:grid;gap:13px}
.positionFilterTop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.positionFilterTitle{font-size:14px;font-weight:900}
.positionFilterArea{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(260px,1.2fr);gap:14px;align-items:start}
.positionSubArea{display:grid;gap:12px}
.positionBlock{background:#fffaf3;border:1px dashed #e3d4c1;border-radius:16px;padding:11px}
.positionBlock .label{margin-bottom:8px}
.positionBlock .filterChips{gap:7px}
.positionBlock.major .filterChip{font-size:13px;font-weight:900;padding:10px 15px}
.positionHint{font-size:12px;color:var(--muted);line-height:1.65;background:#fbf7ef;border-radius:14px;padding:9px 11px}
@media(max-width:760px){.positionFilterArea{grid-template-columns:1fr}}
.detailPanel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.deleteGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.deleteCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.deleteCard h3{margin:0 0 6px;font-size:16px}
.deleteCard p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.65}
.contactGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.contactCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:.15s}
.contactCard:hover{transform:translateY(-1px);border-color:#c9b89f}
.contactCard.selected{border-color:#517fb8;box-shadow:0 0 0 3px rgba(81,127,184,.13),var(--shadow)}
.contactCard h3{margin:0 0 6px;font-size:16px}

<script>
const DATA_VERSION = '4.03';
const CONTACT_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSepH-ZdScbl_HDJ3wXhfumMIaoATbIpUcVVgwpb831sFx24tw/viewform';
const ANALYTICS_VIEW_NAMES = {
  all:'all_characters', available:'available', pro:'pro_players', graduates:'graduates', favorites:'favorites',
  about:'about', cloudSync:'cloud_sync', tags:'tags_sort', debutManage:'debut_order', bulkManage:'bulk_add', imageManage:'image_settings',
  manage:'roster_manage', dataTools:'data_tools', contact:'contact'
};
function trackEvent(name, params={}){
  try{
    if(typeof window.gtag!=='function') return;
    const safeParams={};
    Object.entries(params||{}).forEach(([key,value])=>{
      if(value===undefined || value===null || value==='') return;
      if(['string','number','boolean'].includes(typeof value)) safeParams[key]=value;
    });
    window.gtag('event', name, safeParams);
  }catch(e){}
}
function trackAppView(view){
  const viewName=ANALYTICS_VIEW_NAMES[view];
  if(viewName) trackEvent('app_view',{view_name:viewName});
}


const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBpOrfaTnEpOsdBogyvyBQmzIl2LrIaZq0",
  authDomain: "pawapuro-character-manager.firebaseapp.com",
  projectId: "pawapuro-character-manager",
  storageBucket: "pawapuro-character-manager.firebasestorage.app",
  messagingSenderId: "1092446677351",
  appId: "1:1092446677351:web:148c0bb6d28f4c0f1ba7c2"
};
const CLOUD_LINKED_UID_KEY = 'pawapuro-character-manager-cloud-linked-uid';
const LOCAL_UPDATED_AT_KEY = 'pawapuro-character-manager-complete-local-updated-at';
const CLOUD_CHUNK_MAX_BYTES = 400000;
let firebaseApp = null;
let firebaseAuth = null;
let firebaseDb = null;
let cloudUser = null;
let cloudStatus = 'signed_out';
let cloudError = '';
let cloudLastMeta = null;
let cloudSyncEnabled = false;
let cloudSyncTimer = null;
let cloudBusy = false;
let cloudApplyingRemote = false;
let cloudResyncRequested = false;
let cloudAuthReady = false;

function firebaseReady(){ return !!(firebaseApp && firebaseAuth && firebaseDb); }
function cloudMetaRef(uidValue=cloudUser?.uid){ return firebaseDb.doc(`users/${uidValue}/pawapuro/meta`); }
function cloudChunkRef(uidValue,syncId,index){ return firebaseDb.doc(`users/${uidValue}/pawapuro_chunks/${syncId}_${String(index).padStart(4,'0')}`); }
function formatCloudTime(value){
  try{
    const d = value?.toDate ? value.toDate() : (value ? new Date(value) : null);
    if(!d || Number.isNaN(d.getTime())) return '未記録';
    return d.toLocaleString('ja-JP');
  }catch(e){ return '未記録'; }
}
function currentLocalUpdatedAt(){
  try{ return localStorage.getItem(LOCAL_UPDATED_AT_KEY) || ''; }catch(e){ return ''; }
}
function cloudComparableObject(st){
  const n=normalizeState(deepClone(st));
  return {characters:n.characters, creations:n.creations, settings:n.settings};
}
function cloudComparableJson(st){ return JSON.stringify(cloudComparableObject(st)); }
async function sha256Hex(text){
  if(window.crypto?.subtle && window.TextEncoder){
    const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(text||'')));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h1=0x811c9dc5, h2=0x9e3779b9;
  const str=String(text||'');
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    h1=Math.imul(h1^c,0x01000193)>>>0;
    h2=Math.imul(h2^(c+i),0x85ebca6b)>>>0;
  }
  return `${h1.toString(16).padStart(8,'0')}${h2.toString(16).padStart(8,'0')}`;
}
function splitUtf8Chunks(text,maxBytes=CLOUD_CHUNK_MAX_BYTES){
  const str=String(text||'');
  if(!str) return [''];
  const enc=new TextEncoder();
  const chunks=[];
  let start=0;
  while(start<str.length){
    let low=start+1, high=Math.min(str.length,start+maxBytes), best=start;
    while(low<=high){
      const mid=Math.floor((low+high)/2);
      const bytes=enc.encode(str.slice(start,mid)).length;
      if(bytes<=maxBytes){ best=mid; low=mid+1; }
      else high=mid-1;
    }
    if(best<=start) throw new Error('クラウド保存用データを分割できませんでした');
    chunks.push(str.slice(start,best));
    start=best;
  }
  return chunks;
}
function cloudSummaryLabel(summary){
  if(!summary) return 'クラウドデータなし';
  return `キャラ ${Number(summary.characters||0)}件 / 作成済み ${Number(summary.created||0)}件 / 画像 ${Number(summary.uploadedImages||0)}件`;
}
function cloudStatusPresentation(){
  if(!firebaseReady()) return ['Firebase未接続','error'];
  if(!cloudUser) return ['未ログイン',''];
  if(cloudStatus==='checking') return ['確認中',''];
  if(cloudStatus==='syncing') return ['同期中',''];
  if(cloudStatus==='pending') return ['保存待ち','warn'];
  if(cloudStatus==='synced') return ['同期済み','ok'];
  if(cloudStatus==='needs_setup') return ['初回設定が必要','warn'];
  if(cloudStatus==='needs_choice') return ['同期方法を選択','warn'];
  if(cloudStatus==='paused') return ['同期停止中','warn'];
  if(cloudStatus==='error') return ['エラー','error'];
  return ['ログイン済み',''];
}
function refreshCloudView(){ if(currentView==='cloudSync') renderCloudSync(); }
function setCloudStatus(status,error=''){
  cloudStatus=status; cloudError=error||''; refreshCloudView();
}
async function getCloudMeta(){
  if(!cloudUser || !firebaseDb) return null;
  const snap=await cloudMetaRef().get();
  if(!snap.exists) return null;
  return snap.data() || null;
}
async function readCloudSnapshot(metaInput=null){
  if(!cloudUser || !firebaseDb) throw new Error('Googleアカウントにログインしてください');
  const meta=metaInput || await getCloudMeta();
  if(!meta?.syncId || !Number.isFinite(Number(meta.chunkCount))) throw new Error('クラウドデータが見つかりません');
  const count=Number(meta.chunkCount);
  const docs=await Promise.all(Array.from({length:count},(_,i)=>cloudChunkRef(cloudUser.uid,meta.syncId,i).get()));
  const parts=docs.map((snap,i)=>{
    if(!snap.exists) throw new Error(`クラウドデータの一部（${i+1}/${count}）が見つかりません`);
    return String(snap.data()?.data ?? '');
  });
  const raw=parts.join('');
  const parsed=JSON.parse(raw);
  validateImportBackupShape(parsed);
  const normalized=normalizeState(deepClone(parsed));
  const hash=await sha256Hex(cloudComparableJson(normalized));
  if(meta.hash && meta.hash!==hash) throw new Error('クラウドデータの整合性を確認できませんでした');
  return {state:normalized,raw:JSON.stringify(normalized),meta};
}
async function cleanupCloudGeneration(uidValue,syncId,count){
  if(!firebaseDb || !uidValue || !syncId || !count) return;
  try{
    const batch=firebaseDb.batch();
    for(let i=0;i<Number(count);i++) batch.delete(cloudChunkRef(uidValue,syncId,i));
    await batch.commit();
  }catch(e){ console.warn('古いクラウド世代の整理に失敗しました',e); }
}
function openCloudConflictModal(remoteMeta){
  const localSummary=importSummaryFor(state);
  const remoteSummary=remoteMeta?.summary || {};
  $('#modalRoot').innerHTML=`<div class="modalBackdrop"><div class="modal" style="max-width:820px"><div class="modalHead"><h2>クラウドとこの端末のデータが異なります</h2><button class="close" data-action="cloud-sync-later">閉じる</button></div>
    <p class="hint">自動で上書きせず、どちらを採用するか選べるようにしています。クラウドを読み込む場合も、この端末の現在データは直前バックアップとして残します。</p>
    <div class="cloudCompare"><div class="cloudCompareBox"><h4>この端末</h4><p>${escapeHtml(cloudSummaryLabel(localSummary))}<br>端末更新: ${escapeHtml(formatCloudTime(currentLocalUpdatedAt()))}</p></div><div class="cloudCompareBox"><h4>クラウド</h4><p>${escapeHtml(cloudSummaryLabel(remoteSummary))}<br>クラウド更新: ${escapeHtml(formatCloudTime(remoteMeta?.updatedAt || remoteMeta?.updatedAtClient))}</p></div></div>
    <div class="inline"><button class="btn primary" data-action="cloud-use-remote">クラウドをこの端末に読み込む</button><button class="btn" data-action="cloud-force-upload">この端末でクラウドを上書き</button><button class="btn" data-action="cloud-sync-later">今は同期しない</button></div>
  </div></div>`;
}
function openCloudFirstSetupModal(){
  const summary=importSummaryFor(state);
  $('#modalRoot').innerHTML=`<div class="modalBackdrop"><div class="modal" style="max-width:760px"><div class="modalHead"><h2>Googleアカウントとの同期を開始</h2><button class="close" data-action="cloud-sync-later">閉じる</button></div>
    <p class="hint">このGoogleアカウントには、まだパワプロ作成キャラ管理ツールのクラウドデータがありません。現在の端末データを最初のクラウドデータとして保存できます。</p>
    <div class="detailPanel"><b>${escapeHtml(cloudSummaryLabel(summary))}</b><div class="hint">キャラクター情報・育成データ・設定・アップロード画像をまとめて保存します。JSONバックアップ機能も引き続き利用できます。</div></div>
    <div class="inline"><button class="btn primary" data-action="cloud-initial-save">この端末のデータをクラウドへ保存</button><button class="btn" data-action="cloud-sync-later">今は同期しない</button></div>
  </div></div>`;
}
function openCloudLoadConfirm(){
  if(!cloudLastMeta){ toast('クラウドデータがありません'); return; }
  $('#modalRoot').innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><h2>クラウドデータを読み込みますか？</h2><button class="close" data-action="close-modal">閉じる</button></div><p class="hint">この端末の現在データは直前バックアップとして保存したうえで、クラウドの内容に置き換えます。</p><div class="inline"><button class="btn primary" data-action="cloud-use-remote">読み込む</button><button class="btn" data-action="close-modal">キャンセル</button></div></div></div>`;
}
function saveCurrentAsAutoBackupBeforeCloud(remoteJson){
  try{
    const oldJson=localStorage.getItem(STORE_KEY);
    if(oldJson && oldJson!==remoteJson){
      localStorage.setItem(AUTO_BACKUP_KEY,oldJson);
      localStorage.setItem(AUTO_BACKUP_TIME_KEY,new Date().toISOString());
    }
  }catch(e){ console.warn('クラウド読み込み前バックアップに失敗しました',e); }
}
async function applyCloudSnapshotToLocal(){
  if(cloudBusy) return;
  cloudBusy=true; setCloudStatus('syncing');
  try{
    const remote=await readCloudSnapshot(cloudLastMeta);
    saveCurrentAsAutoBackupBeforeCloud(remote.raw);
    cloudApplyingRemote=true;
    state=normalizeState(remote.state);
    const json=JSON.stringify(state);
    localStorage.setItem(STORE_KEY,json);
    localStorage.setItem(LOCAL_UPDATED_AT_KEY,new Date().toISOString());
    savedSnapshot=json; dirty=false;
    cloudLastMeta=remote.meta;
    cloudSyncEnabled=true;
    localStorage.setItem(CLOUD_LINKED_UID_KEY,cloudUser.uid);
    setCloudStatus('synced');
    $('#modalRoot').innerHTML='';
    renderCurrent();
    trackEvent('cloud_sync_load');
    toast('クラウドデータを読み込みました');
  }catch(e){
    console.error(e); setCloudStatus('error',String(e?.message||e)); alert('クラウドデータの読み込みに失敗しました。\n'+(e?.message||e));
  }finally{ cloudApplyingRemote=false; cloudBusy=false; }
}
async function writeCloudSnapshot({force=false}={}){
  if(!cloudUser || !firebaseDb){ toast('Googleアカウントにログインしてください'); return false; }
  if(cloudBusy){ cloudResyncRequested=true; return false; }
  cloudBusy=true; setCloudStatus('syncing');
  try{
    const localNormalized=normalizeState(deepClone(state));
    const payload=JSON.stringify(localNormalized);
    const comparable=cloudComparableJson(localNormalized);
    const hash=await sha256Hex(comparable);
    const currentSnap=await cloudMetaRef().get();
    const remoteMeta=currentSnap.exists ? (currentSnap.data()||{}) : null;
    if(remoteMeta?.hash===hash){
      cloudLastMeta=remoteMeta; cloudSyncEnabled=true; localStorage.setItem(CLOUD_LINKED_UID_KEY,cloudUser.uid); setCloudStatus('synced'); return true;
    }
    if(!force && remoteMeta){
      const knownSync=cloudLastMeta?.syncId || '';
      if(!knownSync || (remoteMeta.syncId && remoteMeta.syncId!==knownSync)){
        cloudLastMeta=remoteMeta; cloudSyncEnabled=false; setCloudStatus('needs_choice'); openCloudConflictModal(remoteMeta); return false;
      }
    }
    const chunks=splitUtf8Chunks(payload);
    if(chunks.length>450) throw new Error('クラウド保存データが大きすぎます。JSONバックアップをご利用ください。');
    const syncId=`s${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
    const batch=firebaseDb.batch();
    chunks.forEach((data,i)=>batch.set(cloudChunkRef(cloudUser.uid,syncId,i),{syncId,index:i,data}));
    const summary=importSummaryFor(localNormalized);
    const oldPreviousSyncId=remoteMeta?.previousSyncId || '';
    const oldPreviousChunkCount=Number(remoteMeta?.previousChunkCount||0);
    const metaData={
      schemaVersion:1,
      dataVersion:DATA_VERSION,
      syncId,
      chunkCount:chunks.length,
      byteLength:new TextEncoder().encode(payload).length,
      hash,
      summary,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAtClient:new Date().toISOString(),
      previousSyncId:remoteMeta?.syncId || '',
      previousChunkCount:Number(remoteMeta?.chunkCount||0)
    };
    batch.set(cloudMetaRef(),metaData);
    await batch.commit();
    const fresh=await getCloudMeta();
    cloudLastMeta=fresh || {...metaData,updatedAt:null};
    cloudSyncEnabled=true;
    localStorage.setItem(CLOUD_LINKED_UID_KEY,cloudUser.uid);
    setCloudStatus('synced');
    trackEvent('cloud_sync_save',{chunks:chunks.length});
    if(oldPreviousSyncId && oldPreviousChunkCount) cleanupCloudGeneration(cloudUser.uid,oldPreviousSyncId,oldPreviousChunkCount);
    return true;
  }catch(e){
    console.error(e); setCloudStatus('error',String(e?.message||e));
    toast('クラウド保存に失敗しました');
    return false;
  }finally{
    cloudBusy=false;

}
function scheduleCloudSync(){

async function handleCloudAuthState(user){

  if(!user){
    cloudSyncEnabled=false; cloudLastMeta=null; setCloudStatus('signed_out'); return;
  }
  if(startupRecovery){
    cloudSyncEnabled=false; setCloudStatus('paused','ブラウザ保存データの復旧を先に完了してください。'); return;
  }
  setCloudStatus('checking');
  try{
    const meta=await getCloudMeta();
    const localHash=await sha256Hex(cloudComparableJson(state));
    cloudLastMeta=meta;
    if(!meta){
      cloudSyncEnabled=false; setCloudStatus('needs_setup');
      setTimeout(openCloudFirstSetupModal,0);
      return;
    }
    if(meta.hash===localHash){
      cloudSyncEnabled=true; localStorage.setItem(CLOUD_LINKED_UID_KEY,user.uid); setCloudStatus('synced'); return;
    }
    cloudSyncEnabled=false; setCloudStatus('needs_choice');
    setTimeout(()=>openCloudConflictModal(meta),0);
  }catch(e){
    console.error(e); cloudSyncEnabled=false; setCloudStatus('error',String(e?.message||e));
  }
}

    const pb = ib!==99999 ? ib : (b==='ポジションなし' ? 0 : (POSITIONS.indexOf(b)>=0 ? POSITIONS.indexOf(b)+1 : 999));
    cmp = pa-pb || comparePrimitive(a,b);
  }else if(groupType==='mode'){
    const ia=priorityIndex('mode',a,st), ib=priorityIndex('mode',b,st);
    const order=['未作成',...MODES];
    const ma = ia!==99999 ? ia : (order.indexOf(a)>=0 ? order.indexOf(a) : 999);
    const mb = ib!==99999 ? ib : (order.indexOf(b)>=0 ? order.indexOf(b) : 999);
    cmp = ma-mb || comparePrimitive(a,b);
  }else cmp = comparePrimitive(a,b);
  // グループ化されたソートでは、昇順/降順はグループ見出しの順番にだけ反映する。

  return (pref.sortKey===groupSortKeyForType(groupType) && pref.sortDir==='desc') ? -cmp : cmp;
}
function orderedGroupKeys(list, groupType, st=listState(), pref=viewPref()){

function formatMetricNumber(value){
  if(typeof value === 'number'){
    if(!Number.isFinite(value)) return '0';
    return Number.isInteger(value) ? String(value) : value.toFixed(1).replace(/\.0$/,'');
  }
  return String(value ?? '0');
}

}
function avgOfStarsFromChars(chars, st=listState(), ignoreZero=false){
  const nums=chars.map(c=>visibleStar(creationFrom(st,c))).filter(n=>Number.isFinite(n) && (!ignoreZero || n>0));
  if(!nums.length) return 0;
  return nums.reduce((a,b)=>a+b,0)/nums.length;
}
function topByStar(chars, n, st=listState()){
  return [...chars].sort((a,b)=>{
    const diff=visibleStar(creationFrom(st,b))-visibleStar(creationFrom(st,a));
    if(diff) return diff;
    return sortChars([a,b], st, {sortKey:'作品順',sortDir:'asc',filters:[],filterMode:'AND',positionFilterMode:'OR',fielderPositionFilterMode:'OR',pitchingFilterMode:'OR'}).indexOf(a)===0 ? -1 : 1;
  }).slice(0,n);
}
function excludeChosen(chars, chosen){
  const ids=new Set(chosen.map(c=>c.id));
  return chars.filter(c=>!ids.has(c.id));
}
function proChars(st=listState()){
  return st.characters.filter(c=>isPro(creationFrom(st,c)));

function firstTeamPitchers(st=listState()){
  const pros=proChars(st).filter(c=>mainPositionLabel(creationFrom(st,c))==='投手');
  let chosen=[];
  let rest=[...pros];
  const hasRole=(c,role)=>pitchingRolesOf(creationFrom(st,c)).includes(role);
  const hasAllRoles=(c,roles)=>roles.every(r=>hasRole(c,r));
  const pick=(filterFn,n)=>{
    const picked=topByStar(rest.filter(filterFn), n, st);
    chosen.push(...picked);
    rest=excludeChosen(rest,picked);
  };
  pick(c=>hasRole(c,'先発'),6);
  pick(c=>hasRole(c,'抑え'),1);
  pick(c=>hasAllRoles(c,['先発','中継ぎ']),2);
  pick(c=>hasRole(c,'中継ぎ'),6);
  return chosen;
}
function firstTeamFielders(st=listState()){
  const pros=proChars(st).filter(c=>FIELD_POSITIONS.includes(mainPositionLabel(creationFrom(st,c))));
  let chosen=[];
  let rest=[...pros];
  const pickPosition=(pos,n)=>{
    const picked=topByStar(rest.filter(c=>mainPositionLabel(creationFrom(st,c))===pos), n, st);
    chosen.push(...picked);
    rest=excludeChosen(rest,picked);
  };
  ['捕手','一塁手','二塁手','遊撃手','三塁手'].forEach(pos=>pickPosition(pos,1));
  pickPosition('外野手',3);
  const bench=topByStar(rest.filter(c=>FIELD_POSITIONS.includes(mainPositionLabel(creationFrom(st,c)))),8,st);
  chosen.push(...bench);
  return chosen;
}

function metricDefinition(key){ return dashboardMetricDefs().find(m=>m.key===key); }
function dashboardMetricStats(st=listState()){
  const chars=st.characters;
  const total=chars.length;
  const created=chars.filter(c=>isCreated(creationFrom(st,c))).length;
  const uncreated=total-created;
  const pro=chars.filter(c=>isPro(creationFrom(st,c))).length;
  const available=chars.filter(c=>{ const tags=allTagsFrom(st,c); return tags.includes('未プロ') || tags.includes('未作成'); }).length;
  const createdNotPro=chars.filter(c=>isCreated(creationFrom(st,c)) && allTagsFrom(st,c).includes('未プロ')).length;
  const favorite=chars.filter(c=>creationFrom(st,c).favorite).length;
  const favUncreated=chars.filter(c=>creationFrom(st,c).favorite && !isCreated(creationFrom(st,c))).length;
  const eikan=chars.filter(c=>creationFrom(st,c).mode==='栄冠ナイン').length;
  const success=chars.filter(c=>creationFrom(st,c).mode==='サクセス').length;
  const powerfes=chars.filter(c=>creationFrom(st,c).mode==='パワフェス').length;
  const legend=chars.filter(c=>creationFrom(st,c).mode==='レジェンドバトル').length;
  const reenroll=chars.filter(c=>eikanRecordsOf(creationFrom(st,c)).length>1).length;
  const imageReady=chars.filter(c=>!!imgSrc(c)).length;
  const createdStars=chars.map(c=>visibleStar(creationFrom(st,c))).filter(n=>n>0);
  const maxStar=createdStars.length ? Math.max(...createdStars) : 0;
  const avgStar=createdStars.length ? Math.round(createdStars.reduce((a,b)=>a+b,0)/createdStars.length) : 0;
  return {total,created,uncreated,available,pro,notPro:total-pro,createdNotPro,favorite,favUncreated,eikan,success,powerfes,legend,reenroll,imageReady,maxStar,avgStar};
}
function dashboardKpiKeys(st=listState()){

function setDashboardKpiOrder(fromIndex, toIndex){

function graduateEntriesForSchool(school, st=listState()){
  const rows=[];
  st.characters.forEach(c=>{
    const cr=creationFrom(st,c);
    if(cr.mode!=='栄冠ナイン') return;
    const records=eikanRecordsOf(cr);
    records.forEach((r,i)=>{
      if(r.school===school && r.enrollmentYear){
        rows.push({
          year:Number(r.enrollmentYear),
          character:c,
          record:r,
          recordIndex:i,
          isFinalRecord:i===records.length-1,
          label:i===0?'通常入学':`再入学（${i+1}回目）`
        });
      }
    });
  });
  // 卒業生名簿は入学年度を固定の第1キーにし、同年度内は
  // 「卒業生名簿」自身の選択中ソートを、そのまま主キーとして使う。
  // 2件だけを都度 sortChars() に通して順位差へ変換する旧方式はやめ、
  // 共通 comparator を直接使うことで、星順が意図せず前面に残る挙動を防ぐ。
  const pref=viewPref('graduates');
  const compareCharacters=characterComparator(st,pref);
  return rows.sort((a,b)=>{
    const yearCmp=a.year-b.year;
    if(yearCmp) return yearCmp;
    return compareCharacters(a.character,b.character);
  });
}

function parseImageExperimentCsv(){
  const text=$('#imageExpCsvText')?.value || imageExperimentFormState.csvText || '';
  imageExperimentFormState.csvText=text;
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length) return [];
  const headRaw=csvSplitLine(lines[0]);
  const header=headRaw.map(h=>({
    'name':'name','名前':'name','キャラ名':'name',
    'work':'work','作品':'work',
    'imageUrl':'imageUrl','imageURL':'imageUrl','画像URL':'imageUrl','画像url':'imageUrl','url':'imageUrl','URL':'imageUrl'
  }[h] || h));
  const hasHeader=header.includes('name') && header.includes('imageUrl');
  const start=hasHeader?1:0;
  const rows=[];
  for(let i=start;i<lines.length;i++){
    const cols=csvSplitLine(lines[i]);
    let raw={};
    if(hasHeader) header.forEach((h,j)=>raw[h]=cols[j]||'');
    else raw={name:cols[0]||'', imageUrl:cols[1]||'', work:cols[2]||''};
    rows.push({name:String(raw.name||'').trim(), imageUrl:String(raw.imageUrl||'').trim(), work:normalizeExperimentWork(raw.work||'')});
  }
  return evaluateImageExperimentRows(rows);
}
function evaluateImageExperimentRows(rows){
  const workFilter=imageUrlCheckState.workFilter || '__ALL__';
  return rows.map((r,index)=>{
    let status='反映候補', reason='名前が一致しました。', target=null;
    if(!r.name){ status='除外'; reason='名前が入力されていません。'; }
    else if(!r.imageUrl){ status='除外'; reason='画像URLが入力されていません。'; }
    else {
      let matches=state.characters.filter(c=>String(c.name||'').trim()===r.name);
      const specifiedWork=String(r.work||'').trim();
      if(specifiedWork) matches=matches.filter(c=>workDisplay(c)===specifiedWork);
      else if(workFilter!=='__ALL__') matches=matches.filter(c=>workDisplay(c)===workFilter);
      if(matches.length===0){ status='該当なし'; reason='一致するキャラクターが見つかりませんでした。'; }
      else if(matches.length>1){ status='要確認'; reason='同名のキャラクターが複数登録されています。作品列を指定してください。'; }
      else {
        target=matches[0];
        if(imgSrc(target)){ status='上書き候補'; reason='名前が一致しました（現在の画像が登録されています）。'; }
      }
    }
    const canApply=!!target && (status==='反映候補' || status==='上書き候補');
    return {index:index+1, name:r.name, work:r.work||'', imageUrl:r.imageUrl, targetId:target?.id||'', targetName:target?.name||'', targetWork:target?workDisplay(target):'', currentImage:target?imgSrc(target):'', status, reason, canApply, selected:canApply};
  });
}

function probeImageUrl(url, timeoutMs=7000){
  const u=String(url||'').trim();
  if(!u) return Promise.resolve({status:'URLなし', detail:'画像URLが登録されていません'});
  return new Promise(resolve=>{
    let settled=false;
    const img=new Image();
    const finish=(status,detail)=>{
      if(settled) return;
      settled=true;
      clearTimeout(timer);
      img.onload=null; img.onerror=null;
      resolve({status,detail});
    };
    const timer=setTimeout(()=>finish('読み込み失敗','時間内に画像を読み込めませんでした'),timeoutMs);
    img.onload=()=>finish('正常', `${img.naturalWidth||0}×${img.naturalHeight||0}`);
    img.onerror=()=>finish('読み込み失敗','このブラウザで画像を読み込めませんでした');
    try{ img.src=u; }catch(err){ finish('読み込み失敗','URLを画像として読み込めませんでした'); }
  });
}
function imageUrlCheckStatusTag(status){
  if(status==='正常') return '<span class="tag ok">正常</span>';
  if(status==='読み込み失敗') return '<span class="tag blank">読み込み失敗</span>';
  if(status==='URLなし') return '<span class="tag">URLなし</span>';
  return `<span class="tag">${escapeHtml(status||'未確認')}</span>`;

async function startImageUrlCheck(){
  if(imageUrlCheckState.running) return;
  const runId=++imageUrlCheckRunId;
  const targets=imageUrlCheckTargets();
  imageUrlCheckState.running=true;
  imageUrlCheckState.done=0;
  imageUrlCheckState.total=targets.length;
  imageUrlCheckState.results=targets.map(c=>({
    id:c.id,
    name:c.name,
    work:workDisplay(c),
    group:groupTag(c)||'',
    url:String(c.imageUrl||'').trim(),
    status:c.imageUrl ? '確認待ち' : 'URLなし',
    detail:c.imageUrl ? '確認待ち' : '画像URLが登録されていません'
  }));
  if(currentView==='imageManage') renderCurrent();

  let cursor=0;
  const worker=async()=>{
    while(true){
      const i=cursor++;
      if(i>=imageUrlCheckState.results.length || runId!==imageUrlCheckRunId) return;
      const row=imageUrlCheckState.results[i];
      if(row.status==='URLなし'){
        imageUrlCheckState.done++;
      }else{
        const result=await probeImageUrl(row.url);
        if(runId!==imageUrlCheckRunId) return;
        row.status=result.status;
        row.detail=result.detail;
        imageUrlCheckState.done++;
      }
      if(currentView==='imageManage' && (imageUrlCheckState.done===imageUrlCheckState.total || imageUrlCheckState.done%5===0)) renderCurrent();
    }
  };
  const workers=[];
  const concurrency=Math.min(8, Math.max(1, targets.length));
  for(let i=0;i<concurrency;i++) workers.push(worker());
  await Promise.all(workers);
  if(runId!==imageUrlCheckRunId) return;
  imageUrlCheckState.running=false;
  if(currentView==='imageManage') renderCurrent();
  toast('画像URLチェックが完了しました');
}

function stableStringify(value){
  const seen=new WeakSet();
  const sortValue=v=>{
    if(v===null || typeof v!=='object') return v;
    if(seen.has(v)) return '[Circular]';
    seen.add(v);
    if(Array.isArray(v)) return v.map(sortValue);
    const out={};
    Object.keys(v).sort().forEach(k=>out[k]=sortValue(v[k]));
    return out;
  };
  return JSON.stringify(sortValue(value));
}
function dataIntegrityIssue(severity, category, title, detail=''){
  return {severity,category,title,detail:String(detail||'')};
}
function runDataIntegrityCheck(){
  const issues=[];
  const chars=Array.isArray(state.characters)?state.characters:[];
  const creations=(state.creations && typeof state.creations==='object')?state.creations:{};
  const settings=(state.settings && typeof state.settings==='object')?state.settings:{};
  const ids=new Map();
  const charIdSet=new Set();
  const nameWorkMap=new Map();

  chars.forEach((c,index)=>{
    const id=String(c?.id||'').trim();
    const name=String(c?.name||'').trim();
    const work=workDisplay(c||{});
    if(!id) issues.push(dataIntegrityIssue('error','キャラ名簿',`#${index+1} のキャラIDが空です`, name||'名前も未設定'));
    else { ids.set(id,(ids.get(id)||0)+1); charIdSet.add(id); }
    if(!name) issues.push(dataIntegrityIssue('error','キャラ名簿',`${id||`#${index+1}`} の名前が空です`, work||''));
    const nw=`${work}::${name}`;
    if(name) nameWorkMap.set(nw,(nameWorkMap.get(nw)||0)+1);
    if(c && ('tags' in c || 'autoTags' in c)) issues.push(dataIntegrityIssue('warning','旧形式',`${name||id} に旧タグ保存項目が残っています`,'自動タグは保存せず毎回計算する現行仕様です'));
    const imageUrl=String(c?.imageUrl||'').trim();
    if(imageUrl && !/^(https?:\/\/|data:image\/)/i.test(imageUrl)) issues.push(dataIntegrityIssue('warning','画像',`${name||id} の画像URL形式を確認してください`,imageUrl));
    const uploaded=String(c?.uploadedImage||'').trim();
    if(uploaded && !/^data:image\//i.test(uploaded)) issues.push(dataIntegrityIssue('warning','画像',`${name||id} のアップロード画像形式を確認してください`,'data:image/... 形式ではありません'));
  });
  [...ids.entries()].filter(([,n])=>n>1).forEach(([id,n])=>issues.push(dataIntegrityIssue('error','キャラ名簿',`キャラID「${id}」が${n}件重複しています`,'ID重複は作成情報の紐付け事故につながります')));
  [...nameWorkMap.entries()].filter(([,n])=>n>1).forEach(([key,n])=>{
    const [work,name]=key.split('::');
    issues.push(dataIntegrityIssue('warning','キャラ名簿',`${work}「${name}」が${n}件あります`,'意図した同名登録か確認してください'));
  });

  Object.keys(creations).forEach(id=>{
    if(!charIdSet.has(id)) issues.push(dataIntegrityIssue('error','作成情報',`存在しないキャラID「${id}」の作成情報があります`,'名簿から孤立した作成情報です'));
  });
  chars.forEach(c=>{
    const id=String(c?.id||'');
    if(id && !Object.prototype.hasOwnProperty.call(creations,id)) issues.push(dataIntegrityIssue('warning','作成情報',`${c.name||id} の作成情報オブジェクトがありません`,'通常は空の作成情報が1件作られます'));
    const cr=creations[id];
    if(!cr || typeof cr!=='object') return;
    const legacy=['school','enrollmentYear','proStatus','reenroll','reenrollSchool','reenrollYear','reenrollProStatus','pitchingRole','tags','autoTags'].filter(k=>Object.prototype.hasOwnProperty.call(cr,k));
    if(legacy.length) issues.push(dataIntegrityIssue('warning','旧形式',`${c.name||id} の作成情報に旧項目が残っています`,legacy.join(', ')));
    const mode=String(cr.mode||'');
    if(mode && !MODES.includes(mode)) issues.push(dataIntegrityIssue('error','作成情報',`${c.name||id} の作成モードが不正です`,mode));
    if(!mode){
      const playerData=Number(cr.stars||0)>0 || !!cr.mainPosition || (Array.isArray(cr.subPositions)&&cr.subPositions.length) || (Array.isArray(cr.pitchingRoles)&&cr.pitchingRoles.length) || (Array.isArray(cr.eikanRecords)&&cr.eikanRecords.length);
      if(playerData) issues.push(dataIntegrityIssue('warning','作成情報',`${c.name||id} は未作成なのに選手情報が残っています`,'星・ポジション・栄冠記録などを確認してください'));
    }
    if(cr.mainPosition && !POSITIONS.includes(cr.mainPosition)) issues.push(dataIntegrityIssue('error','作成情報',`${c.name||id} のメインポジションが不正です`,cr.mainPosition));
    if(Array.isArray(cr.subPositions)){
      const bad=cr.subPositions.filter(p=>!SUB_POSITIONS.includes(p));
      if(bad.length) issues.push(dataIntegrityIssue('error','作成情報',`${c.name||id} のサブポジションに不正値があります`,bad.join(', ')));
      if(new Set(cr.subPositions).size!==cr.subPositions.length) issues.push(dataIntegrityIssue('warning','作成情報',`${c.name||id} のサブポジションが重複しています`,cr.subPositions.join(', ')));
      if(cr.mainPosition && cr.subPositions.includes(cr.mainPosition)) issues.push(dataIntegrityIssue('warning','作成情報',`${c.name||id} のメインとサブに同じポジションがあります`,cr.mainPosition));
    }
    if(Array.isArray(cr.pitchingRoles)){
      const bad=cr.pitchingRoles.filter(p=>!PITCHING_ROLES.includes(p));
      if(bad.length) issues.push(dataIntegrityIssue('error','作成情報',`${c.name||id} の投手適正に不正値があります`,bad.join(', ')));
      if(cr.mainPosition!=='投手' && cr.pitchingRoles.length) issues.push(dataIntegrityIssue('warning','作成情報',`${c.name||id} はメイン投手ではないのに投手適正があります`,cr.pitchingRoles.join(', ')));
    }
    if(cr.stars!=='' && cr.stars!==null && cr.stars!==undefined){
      const stars=Number(cr.stars);
      if(!Number.isFinite(stars) || stars<0 || stars>999) issues.push(dataIntegrityIssue('error','作成情報',`${c.name||id} の星が範囲外です`,String(cr.stars)));
    }
    const records=Array.isArray(cr.eikanRecords)?cr.eikanRecords:[];
    if(mode==='栄冠ナイン' && !records.length) issues.push(dataIntegrityIssue('error','栄冠記録',`${c.name||id} は栄冠ナインですが入学記録がありません`,''));
    if(mode!=='栄冠ナイン' && records.length) issues.push(dataIntegrityIssue('warning','栄冠記録',`${c.name||id} は栄冠ナイン以外なのに栄冠記録があります`,`${records.length}件`));
    records.forEach((r,i)=>{
      const expected=i===0?'通常入学':'再入学';
      if(r?.type!==expected) issues.push(dataIntegrityIssue('warning','栄冠記録',`${c.name||id} の${i+1}件目の種別が不整合です`,`現在: ${r?.type||'空'} / 想定: ${expected}`));
      const y=r?.enrollmentYear;
      if(y!=='' && y!==null && y!==undefined && (!Number.isFinite(Number(y)) || Number(y)<1930 || Number(y)>2100)) issues.push(dataIntegrityIssue('error','栄冠記録',`${c.name||id} の入学年度が範囲外です`,String(y)));
      if(r?.proStatus!=='プロ' && r?.proStatus!=='未プロ') issues.push(dataIntegrityIssue('error','栄冠記録',`${c.name||id} のプロ状況が不正です`,String(r?.proStatus||'')));
      if(i<records.length-1 && r?.proStatus==='プロ') issues.push(dataIntegrityIssue('error','栄冠記録',`${c.name||id} はプロ入り後に再入学記録があります`,`${i+1}件目でプロ入り後、さらに記録が続いています`));
    });
    if(Array.isArray(cr.manualTags)) cr.manualTags.forEach(tag=>{
      if(!Array.isArray(settings.manualTags) || !settings.manualTags.includes(tag)) issues.push(dataIntegrityIssue('warning','手動タグ',`${c.name||id} のタグ「${tag}」がタグ一覧にありません`,'タグマスターとの不整合です'));
    });
  });

  const usedSchools=new Set();
  chars.forEach(c=>{ const cr=creations[c.id]; if(cr?.mode==='栄冠ナイン' && Array.isArray(cr.eikanRecords)) cr.eikanRecords.forEach(r=>{ if(String(r?.school||'').trim()) usedSchools.add(String(r.school).trim()); }); });
  usedSchools.forEach(school=>{ if(!Array.isArray(settings.schools) || !settings.schools.includes(school)) issues.push(dataIntegrityIssue('warning','学校設定',`使用中の学校「${school}」が学校リストにありません`,'入力候補リストとの不整合です')); });

  if(settings.debutPriority && typeof settings.debutPriority==='object'){
    Object.entries(settings.debutPriority).forEach(([work,list])=>{
      if(!Array.isArray(list)){ issues.push(dataIntegrityIssue('error','デビュー順',`${work} のデビュー順データが配列ではありません`,'')); return; }
      if(new Set(list).size!==list.length) issues.push(dataIntegrityIssue('warning','デビュー順',`${work} のデビュー順に同じキャラIDが重複しています`,''));
      list.forEach(id=>{
        const c=chars.find(x=>x.id===id);
        if(!c) issues.push(dataIntegrityIssue('warning','デビュー順',`${work} のデビュー順に存在しないIDがあります`,id));
        else if(workDisplay(c)!==work && workTag(c)!==work) issues.push(dataIntegrityIssue('warning','デビュー順',`${work} のデビュー順に別作品のキャラが含まれています`,`${c.name} / ${workDisplay(c)}`));
      });
    });
  }

  try{
    const json=JSON.stringify(state);
    const restored=normalizeState(JSON.parse(json));
    if(stableStringify(state)!==stableStringify(restored)) issues.push(dataIntegrityIssue('error','保存・復元','JSON往復シミュレーションで内容が変化しました','書き出し→読み込み時に正規化で差分が発生する可能性があります'));
  }catch(err){
    issues.push(dataIntegrityIssue('error','保存・復元','JSON往復シミュレーションに失敗しました',err?.message||String(err)));
  }

  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      const rawVersion=String(parsed?.dataVersion||'未記録');
      if(rawVersion!==DATA_VERSION) issues.push(dataIntegrityIssue('info','保存・復元',`ブラウザ保存のdataVersionは ${rawVersion} です`,`現在のサイトは ${DATA_VERSION}。読み込み時に現行形式へ正規化されます`));
    }else{
      issues.push(dataIntegrityIssue('info','保存・復元','ブラウザ保存データがまだ作成されていません。','初期データ表示中、またはlocalStorage未保存の状態です'));
    }
  }catch(err){
    issues.push(dataIntegrityIssue('error','保存・復元','ブラウザ保存JSONを解析できません',err?.message||String(err)));
  }

  dataIntegrityCheckState={results:issues,checkedAt:new Date().toLocaleString('ja-JP')};
  renderCurrent();
  const errors=issues.filter(x=>x.severity==='error').length;
  const warnings=issues.filter(x=>x.severity==='warning').length;
  toast(errors||warnings?`整合性チェック完了：エラー ${errors} / 要確認 ${warnings}`:'整合性チェック完了：問題は見つかりませんでした');
}

function csvSplitLine(line){
  const out=[]; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(inQuotes && line[i+1]==='"'){ cur+='"'; i++; }
      else inQuotes=!inQuotes;
    }else if(ch===',' && !inQuotes){ out.push(cur.trim()); cur=''; }
    else cur+=ch;
  }
  out.push(cur.trim());
  return out;
}
function normalizeExperimentWork(work){
  const w=String(work||'その他').trim() || 'その他';
  return w==='学マス' ? '学園アイドルマスター' : w;
}
function candidateDuplicate(cand){
  const w=normalizeExperimentWork(cand.work);
  return state.characters.find(c=>workDisplay(c)===w && String(c.name||'').trim()===String(cand.name||'').trim());
}
function makeExperimentCandidate(raw, defaults={}){
  return {
    name:String(raw.name ?? raw['名前'] ?? '').trim(),
    furigana:String(raw.furigana ?? raw['ふりがな'] ?? '').trim(),
    work:normalizeExperimentWork(raw.work ?? raw['作品'] ?? defaults.work ?? 'その他'),
    group:String(raw.group ?? raw['作品内グループ'] ?? raw['グループ'] ?? defaults.group ?? '').trim(),
    imageUrl:String(raw.imageUrl ?? raw['画像URL'] ?? raw['画像url'] ?? raw['imageURL'] ?? '').trim(),
    debutDate:String(raw.debutDate ?? raw['デビュー日'] ?? '').trim(),
    sortOrder:String(raw.sortOrder ?? raw['並び順'] ?? '').trim()
  };
}
function evaluateExperimentCandidates(candidates){
  const seen=new Set();
  return candidates.map((cand,index)=>{
    const key=`${normalizeExperimentWork(cand.work)}::${cand.name}`;
    let status='追加候補', reason='追加可能です。';
    if(!cand.name){ status='除外'; reason='名前が入力されていません。'; }
    else if(candidateDuplicate(cand)){ status='重複'; reason='同じ作品・同じ名前のキャラクターがすでに登録されています。'; }
    else if(seen.has(key)){ status='重複'; reason='貼り付けた内容の中で重複しています。'; }
    seen.add(key);
    return Object.assign({}, cand, {index:index+1, status, reason, canAdd:status==='追加候補'});
  });
}
function parseExperimentSimple(){
  const work=normalizeExperimentWork($('#expSimpleWork')?.value || experimentFormState.simpleWork);
  const group=($('#expSimpleGroup')?.value || '').trim();
  const text=$('#expSimpleText')?.value || '';
  experimentFormState.simpleWork=work; experimentFormState.simpleGroup=group; experimentFormState.simpleText=text;
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const candidates=lines.map(line=>{
    const cols=csvSplitLine(line);
    return makeExperimentCandidate({name:cols[0]||'', furigana:cols[1]||'', imageUrl:cols[2]||'', debutDate:cols[3]||''}, {work, group});
  });
  return evaluateExperimentCandidates(candidates);
}
function parseExperimentCsv(){
  const text=$('#expCsvText')?.value || '';
  experimentFormState.csvText=text;
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length) return [];
  const headerRaw=csvSplitLine(lines[0]);
  const header=headerRaw.map(h=>({
    'name':'name','名前':'name',
    'furigana':'furigana','ふりがな':'furigana','読み':'furigana',
    'work':'work','作品':'work',
    'group':'group','作品内グループ':'group','グループ':'group',
    'imageUrl':'imageUrl','imageURL':'imageUrl','画像URL':'imageUrl','画像url':'imageUrl',
    'debutDate':'debutDate','デビュー日':'debutDate',
    'sortOrder':'sortOrder','並び順':'sortOrder'
  }[h] || h));
  const hasHeader=header.includes('name');
  const start=hasHeader?1:0;
  const candidates=[];
  for(let i=start;i<lines.length;i++){
    const cols=csvSplitLine(lines[i]);
    let obj={};
    if(hasHeader){ header.forEach((h,j)=>obj[h]=cols[j]||''); }
    else obj={name:cols[0]||'', furigana:cols[1]||'', work:cols[2]||'その他', group:cols[3]||'', imageUrl:cols[4]||'', debutDate:cols[5]||''};
    candidates.push(makeExperimentCandidate(obj));
  }
  return evaluateExperimentCandidates(candidates);
}

function performDataDelete(type){
  if(type==='creations'){
    const next={}; state.characters.forEach(c=>next[c.id]=blankCreation()); state.creations=next;
  }else if(type==='roster'){
    state.characters=[];
    state.creations={};
    state.settings.seedCharactersDisabled=true;
  }else if(type==='manualTags'){
    state.settings.manualTags=[]; Object.values(state.creations).forEach(cr=>cr.manualTags=[]);
  }else if(type==='debut'){
    state.settings.debutPriority={};
  }else if(type==='uploadedImages'){
    state.characters.forEach(c=>c.uploadedImage='');
  }else if(type==='sortPriority'){
    state.settings.sortPriority=deepClone(DEFAULT_SETTINGS.sortPriority);
  }else if(type==='full'){
    state=normalizeState({characters:deepClone(SEED_CHARACTERS),creations:{},settings:deepClone(DEFAULT_SETTINGS)});
  }
  const saved=commitImmediate();
  $('#modalRoot').innerHTML='';
  renderCurrent();
  toast(saved?'削除を実行しました':'削除内容をブラウザ保存できませんでした');
}

function startupRestoreAutoBackup(){
  const info=autoBackupInfo();
  if(!info){ alert('利用可能な自動バックアップはありません。'); openStartupRecoveryModal(); return; }
  const next=normalizeState(deepClone(info.normalized));
  const json=JSON.stringify(next);
  try{ localStorage.setItem(STORE_KEY,json); }
  catch(err){ scheduleStorageSaveError(err,json); return; }
  try{
    localStorage.removeItem(AUTO_BACKUP_KEY);
    localStorage.removeItem(AUTO_BACKUP_TIME_KEY);
  }catch(e){ console.warn('自動バックアップの消費処理に失敗しました',e); }
  startupRecovery=null;
  startupRecoveryImport=null;
  state=next;
  savedSnapshot=json;
  dirty=false;
  $('#modalRoot').innerHTML='';
  renderCurrent();
  toast('自動バックアップから復元しました');
}

function prepareStartupRecoveryImport(text,sourceLabel='JSON'){

  validateImportBackupShape(parsed);
  const normalized=normalizeState(deepClone(parsed));
  startupRecoveryImport={raw,normalized,sourceLabel,sourceVersion:String(parsed.dataVersion||'未記録')};
  openStartupImportPreviewModal();
}

function applyStartupRecoveryImport(){

function restoreAutoBackupNow(){
  const info=autoBackupInfo();
  if(!info){ alert('利用可能な自動バックアップはありません。'); $('#modalRoot').innerHTML=''; renderCurrent(); return; }
  const next=normalizeState(deepClone(info.normalized));
  const json=JSON.stringify(next);
  try{
    // 復元時は現在状態を新しいバックアップにはせず、1回使い切りにする。
    localStorage.setItem(STORE_KEY,json);
  }catch(err){
    dirty=!isSameAsSaved();
    updatePendingBar();
    scheduleStorageSaveError(err,json);
    return;
  }
  try{
    localStorage.removeItem(AUTO_BACKUP_KEY);
    localStorage.removeItem(AUTO_BACKUP_TIME_KEY);
  }catch(e){ console.warn('自動バックアップの消費処理に失敗しました',e); }
  state=next;
  savedSnapshot=json;
  dirty=false;
  $('#modalRoot').innerHTML='';
  renderCurrent();
  toast('直前の状態に戻しました');
}

function filterData(st=listState()){

  const posTokens=['野手',...POSITIONS].map(p=>encodeCriterion('position',p));
  const pitchingRoleTokens=PITCHING_ROLES.map(p=>encodeCriterion('pitchingRole',p));
  const starTokens=['⭐0',...STAR_BUCKETS.map(b=>b.label)].map(s=>encodeCriterion('star',s));
  const manual=(st.settings.manualTags||[]).map(t=>encodeCriterion('manual',t));
  return {worksTokens, groupTokens, modeTokens, statusTokens, schools, years, posTokens, pitchingRoleTokens, starTokens, manual};

function updateCreation(id, key, value, rerender=true){
  const cr = state.creations[id] || (state.creations[id]=blankCreation());
  if(key==='mode'){
    cr.mode=value;
    if(!value){
      cr.eikanRecords=[];
      syncLegacyEikanFields(cr);
      cr.mainPosition=''; cr.subPositions=[]; cr.pitchingRoles=[]; cr.stars=''; syncLegacyEikanFields(cr);
    }
    else if(value!=='栄冠ナイン'){
      cr.eikanRecords=[];
      syncLegacyEikanFields(cr);
    }
    else {
      cr.eikanRecords=normalizeEikanRecords(cr);
      if(!cr.eikanRecords.length) cr.eikanRecords=[makeEikanRecord('通常入学','',2026,'未プロ')];
      if(!cr.eikanRecords[0].enrollmentYear) cr.eikanRecords[0].enrollmentYear=2026;
      syncLegacyEikanFields(cr);
    }
  }else if(key==='stars'){
    const n=Number(value); cr.stars = value==='' ? '' : Math.max(0,Math.min(999,Math.floor(n||0)));
  }else if(key.startsWith('eikanSchool:')){
    const i=Number(key.split(':')[1]); const records=eikanRecordsOf(cr); if(records[i]) records[i].school=value; syncLegacyEikanFields(cr);
  }else if(key.startsWith('eikanYear:')){
    const i=Number(key.split(':')[1]); const records=eikanRecordsOf(cr); if(records[i]) records[i].enrollmentYear=clampYearValue(value); syncLegacyEikanFields(cr);
  }else if(key.startsWith('eikanPro:')){
    const i=Number(key.split(':')[1]); const records=eikanRecordsOf(cr); if(records[i]) records[i].proStatus=value==='プロ'?'プロ':'未プロ'; syncLegacyEikanFields(cr);
  }else if(key==='enrollmentYear' || key==='reenrollYear'){
    const targetKey = key==='enrollmentYear' ? 'eikanYear:0' : 'eikanYear:1';
    updateCreation(id,targetKey,value,false);
  }else if(key==='school' || key==='reenrollSchool'){
    const targetKey = key==='school' ? 'eikanSchool:0' : 'eikanSchool:1';
    updateCreation(id,targetKey,value,false);
  }else if(key==='proStatus' || key==='reenrollProStatus'){
    const targetKey = key==='proStatus' ? 'eikanPro:0' : 'eikanPro:1';
    updateCreation(id,targetKey,value,false);
  }else if(key==='mainPosition'){
    cr[key]=value;
    cr.subPositions = (cr.subPositions||[]).filter(p=>SUB_POSITIONS.includes(p) && p!==value);
    if(value!=='投手'){ cr.pitchingRoles=[]; } syncLegacyEikanFields(cr);
  }else cr[key]=value;
  saveDraft(); if(rerender) rerenderCard(id);
}

const IMAGE_UPLOAD_MAX_DIMENSION=800;
const IMAGE_UPLOAD_WEBP_QUALITY=0.82;
function readImageFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    if(!file){ resolve(''); return; }
    if(!String(file.type||'').startsWith('image/')){
      reject(new Error('画像ファイルを選択してください。'));
      return;
    }
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('画像ファイルを読み込めませんでした。'));
    reader.onload=()=>{
      const image=new Image();
      image.onerror=()=>reject(new Error('画像ファイルを画像として読み込めませんでした。'));
      image.onload=()=>{
        try{
          const sourceWidth=Math.max(1,Number(image.naturalWidth||image.width||1));
          const sourceHeight=Math.max(1,Number(image.naturalHeight||image.height||1));
          const scale=Math.min(1,IMAGE_UPLOAD_MAX_DIMENSION/Math.max(sourceWidth,sourceHeight));
          const width=Math.max(1,Math.round(sourceWidth*scale));
          const height=Math.max(1,Math.round(sourceHeight*scale));
          const canvas=document.createElement('canvas');
          canvas.width=width;
          canvas.height=height;
          const ctx=canvas.getContext('2d',{alpha:true});
          if(!ctx) throw new Error('画像を変換できませんでした。');
          ctx.imageSmoothingEnabled=true;
          ctx.imageSmoothingQuality='high';
          ctx.drawImage(image,0,0,width,height);
          const dataUrl=canvas.toDataURL('image/webp',IMAGE_UPLOAD_WEBP_QUALITY);
          if(!/^data:image\//i.test(dataUrl)) throw new Error('画像を変換できませんでした。');
          resolve(dataUrl);
        }catch(err){
          reject(err instanceof Error ? err : new Error('画像を変換できませんでした。'));
        }
      };
      image.src=String(reader.result||'');
    };
    reader.readAsDataURL(file);
  });
}

function addCharacter(obj){
  const work=normalizeExperimentWork ? normalizeExperimentWork(obj.work || 'その他') : (obj.work || 'その他');
  const name=String(obj.name||'').trim();
  const exists=state.characters.some(c=>workDisplay(c)===work && String(c.name||'').trim()===name);
  if(exists || !name) return false;
  const max=Math.max(0,...state.characters.filter(c=>workDisplay(c)===work).map(c=>Number(c.sortOrder)||0));
  const id=obj.id || `${work}-${name}`.replace(/\s+/g,'-') + '-' + uid();
  state.characters.push({id,name,furigana:obj.furigana||'',work,group:obj.group||'',imageUrl:obj.imageUrl||'',uploadedImage:obj.uploadedImage||'',debutDate:obj.debutDate||'',sortOrder:obj.sortOrder||max+1,profileUrl:obj.profileUrl||''});
  state.creations[id]=blankCreation();
  return true;
}
function parseSimpleBulkFromMenu(){
  const work=($('#bulkSimpleWork')?.value || 'その他').trim() || 'その他';
  const group=($('#bulkSimpleGroup')?.value || '').trim();
  const txt=$('#bulkSimpleText')?.value || '';
  const lines=txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let added=0;
  lines.forEach(line=>{
    const cols=line.split(',').map(x=>x.trim());
    const obj={name:cols[0]||'', furigana:cols[1]||'', work, group, imageUrl:cols[2]||'', debutDate:cols[3]||''};
    if(obj.name && addCharacter(obj)) added++;
  });
  return added;
}

  if(action==='remove-dashboard-kpi'){ removeDashboardKpi(t.dataset.value); return; }
  if(action==='reset-dashboard-kpis'){ resetDashboardKpis(); return; }
  if(action==='image-exp-toggle' && imageExperimentPreview){
    const i=Number(t.dataset.index);
    const row=imageExperimentPreview.rows?.[i];
    if(row?.canApply){ row.selected=!row.selected; renderCurrent(); }
    return;
  }
  if(action==='apply-filter-modal'){ $('#modalRoot').innerHTML=''; renderCurrent(); return; }
  if(action==='clearUpload' && id){ const c=characterById(id); if(c) c.uploadedImage=''; saveDraft(); rerenderCard(id); return; }
  if(action==='delete-character' && id){ deleteCharacter(id); return; }
  if(action==='close-modal'){ $('#modalRoot').innerHTML=''; return; }
  if(action==='cancel-import-preview'){ pendingImportData=null; $('#modalRoot').innerHTML=''; return; }
  if(action==='confirm-import-preview'){ applyPendingImport(); return; }
  if(action==='open-storage-error-json-text'){ openStorageErrorJsonText(); return; }
  if(action==='download-storage-error-json'){ downloadStorageErrorJson(); return; }
  if(action==='open-json-text-export'){ requestAfterUnsaved('JSONテキスト書き出し', openJsonExportModal); return; }
  if(action==='open-json-text-import'){ openJsonTextImportModal(); return; }
  if(action==='confirm-json-text-import'){ requestImportText($('#importJsonText')?.value || ''); return; }
  if(action==='download-json-export'){ downloadExportJson(); return; }
  if(action==='copy-json-export'){ copyExportJson(); return; }
  if(action==='restore-auto-backup'){ requestAfterUnsaved('直前の状態に戻す', openAutoBackupRestoreModal); return; }
  if(action==='confirm-auto-backup-restore'){ restoreAutoBackupNow(); return; }
  if(e.target.id==='sortDirBtn'){ const pref=viewPref(); pref.sortDir = pref.sortDir==='asc' ? 'desc' : 'asc'; saveUiState(); renderCurrent(); return; }
  if(e.target.id==='compactToggle'){ uiState.compactMode=!uiState.compactMode; renderCurrent(); return; }
  if(e.target.id==='openFilterModal'){ openFilterModal(); return; }
  if(e.target.id==='openDashboardKpis'){ openDashboardKpisModal(); return; }
  if(e.target.id==='openAdd' || e.target.id==='openAdd2'){ openAddModal(); return; }
  if(e.target.id==='openBulk'){ goToView('bulkManage'); return; }
  if(e.target.id==='exportFileBtn2'){ requestAfterUnsaved('JSONファイル書き出し', downloadExportJson); return; }
  if(e.target.id==='exportBtn' || e.target.id==='exportBtn2'){ exportJson(); return; }
  if(e.target.id==='resetBtn'){ requestResetState(); return; }
  if(e.target.id==='confirmTagAdd'){
    const value=addManualTagValue($('#tagAddName')?.value);
    if(!value) return alert('タグ名を入力してください。');
    if(pendingTagTargetId){
      const cr=creation(characterById(pendingTagTargetId));
      if(!cr.manualTags.includes(value)) cr.manualTags.push(value);
    }
    const targetId=pendingTagTargetId;
    pendingTagTargetId=null;
    markDataChanged(); $('#modalRoot').innerHTML='';
    if(targetId) rerenderCard(targetId); else renderCurrent();
    toast(`タグ「${value}」を追加しました`);
    return;
  }
  if(e.target.id==='confirmAdd'){
    const name=$('#addName').value.trim(); if(!name) return alert('名前を入力してください。');
    let uploadedImage='';
    const imageFile=$('#addImageFile')?.files?.[0];
    if(imageFile){
      try{ uploadedImage=await readImageFileAsDataUrl(imageFile); }
      catch(err){ return alert(err.message || '画像ファイルを読み込めませんでした。'); }
    }
    const added=addCharacter({name,furigana:$('#addFurigana').value.trim(),work:$('#addWork').value.trim()||'その他',group:$('#addGroup').value.trim(),imageUrl:$('#addImageUrl').value.trim(),uploadedImage,debutDate:$('#addDebutDate').value});
    if(!added) return alert('同じ作品に同名のキャラクターが登録されているか、名前が正しく入力されていません。');
    markDataChanged();
    trackEvent('character_add',{method:'single'});
    if(uploadedImage) trackEvent('image_upload',{source:'character_add'});
    $('#modalRoot').innerHTML=''; renderCurrent(); return;
  }
  if(e.target.id==='expPreviewSimple'){ experimentPreview={label:'名前だけ一括追加', rows:parseExperimentSimple()}; renderCurrent(); return; }
  if(e.target.id==='expPreviewCsv'){ experimentPreview={label:'CSV一括追加', rows:parseExperimentCsv()}; renderCurrent(); return; }
  if(e.target.id==='expClearPreview'){ experimentPreview=null; renderCurrent(); return; }
  if(e.target.id==='expCommitPreview'){ commitExperimentPreview(); return; }
  if(action==='image-manage-clear-upload'){
    const charId=t.dataset.characterId;
    const c=characterById(charId);
    if(c){ c.uploadedImage=''; commitImmediate(); renderCurrent(); toast('アップロード画像を削除しました'); }
    return;
  }
  if(e.target.id==='imageExpPreview'){
    imageExperimentPreview={rows:parseImageExperimentCsv()};
    renderCurrent(); return;
  }
  if(e.target.id==='imageExpClear'){ imageExperimentPreview=null; renderCurrent(); return; }
  if(e.target.id==='imageExpCommit'){ commitImageExperiment(); return; }
  if(e.target.id==='imageCheckStart'){ startImageUrlCheck(); return; }
  if(e.target.id==='imageCheckCopyPrompt'){ copyImageUrlIssuePrompt(); return; }
});
document.addEventListener('input', e=>{
  const t=e.target; const cardEl=t.closest('[data-id]'); const id=cardEl?.dataset.id;
  if(t.id==='search'){ const pref=viewPref(); pref.search=t.value; saveUiState(); renderCurrent(); return; }
  if(t.id==='expSimpleWork'){ experimentFormState.simpleWork=t.value; return; }
  if(t.id==='expSimpleGroup'){ experimentFormState.simpleGroup=t.value; return; }
  if(t.id==='expSimpleText'){ experimentFormState.simpleText=t.value; return; }
  if(t.id==='expCsvText'){ experimentFormState.csvText=t.value; return; }
  if(t.id==='imageExpCsvText'){ imageExperimentFormState.csvText=t.value; return; }
  if(t.dataset.action==='edit-manual-tag-master'){ const i=Number(t.dataset.index); const old=state.settings.manualTags[i]; const val=t.value.trim(); if(old!==undefined && val && old!==val){ renameManualTagValue(old,val); } return; }
  if(id && t.dataset.action && (['enrollmentYear','reenrollYear','stars','memo'].includes(t.dataset.action) || t.dataset.action.startsWith('eikanYear:'))){ updateCreation(id,t.dataset.action,t.value,false); return; }
  if(id && t.dataset.action==='imageUrl'){ updateCharacterField(id,'imageUrl',t.value); return; }
  const row=t.closest('tr[data-id]'); if(row && t.dataset.cfield){ updateCharacterField(row.dataset.id,t.dataset.cfield,t.value); return; }
});
document.addEventListener('change', async e=>{
  const t=e.target; const cardEl=t.closest('[data-id]'); const id=cardEl?.dataset.id;
  if(t.id==='imageCheckWorkFilter'){ imageUrlCheckRunId++; imageUrlCheckState.workFilter=t.value||'__ALL__'; imageExperimentFormState.workFilter=imageUrlCheckState.workFilter; imageExperimentPreview=null; imageUrlCheckState.results=null; imageUrlCheckState.running=false; imageUrlCheckState.done=0; imageUrlCheckState.total=0; renderCurrent(); return; }
  if(t.id==='startupImportFile'){
    const file=t.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ try{ prepareStartupRecoveryImport(reader.result,`ファイル「${file?.name||'JSON'}」`); } catch(err){ alert('読み込みに失敗しました。\n'+err.message); openStartupJsonImportModal(); } };
    reader.onerror=()=>{ alert('読み込みに失敗しました。ファイルを読み取ることができませんでした。'); openStartupJsonImportModal(); };
    reader.readAsText(file);
    return;
  }
  if(t.id==='importFile'){
    const file=t.files[0]; if(!file) return;
    requestImportFile(file); t.value=''; return;
  }
  if(id && t.dataset.action && (['enrollmentYear','reenrollYear','stars'].includes(t.dataset.action) || t.dataset.action.startsWith('eikanYear:'))){ updateCreation(id,t.dataset.action,t.value,true); return; }
  if(id && t.dataset.action==='imageUrl'){ updateCharacterField(id,'imageUrl',t.value); rerenderCard(id); return; }
  if(t.dataset.action==='image-manage-upload'){
    const charId=t.dataset.characterId;
    const file=t.files?.[0]; if(!charId || !file) return;
    try{
      const dataUrl=await readImageFileAsDataUrl(file);
      const c=characterById(charId);
      if(c){ c.uploadedImage=dataUrl; commitImmediate(); trackEvent('image_upload',{source:'image_settings'}); renderCurrent(); toast('画像を縮小・圧縮して登録しました'); }
    }catch(err){ alert(err.message || '画像ファイルを読み込めませんでした。'); }
    return;
  }
  if(id && t.dataset.action==='uploadImage'){
    const file=t.files[0]; if(!file) return;
    try{
      const dataUrl=await readImageFileAsDataUrl(file);
      const c=characterById(id);
      if(c){ c.uploadedImage=dataUrl; saveDraft(); trackEvent('image_upload',{source:'character_edit'}); rerenderCard(id); toast('画像を縮小・圧縮して登録しました'); }
    }catch(err){ alert(err.message || '画像ファイルを読み込めませんでした。'); }
    return;
  }
});
document.addEventListener('toggle', e=>{
  if(e.target.matches && e.target.matches('details.editBox')){
    const id=e.target.closest('[data-id]')?.dataset.id;
    if(!id) return;
    if(e.target.open) openEditors.add(id); else openEditors.delete(id);
    const summary=e.target.querySelector(':scope > summary');
    if(summary) summary.textContent = e.target.open ? '入力フォームを閉じる' : '入力フォームを開く';
  }
}, true);
window.addEventListener('storage', e=>{
  if(e.key!==STORE_KEY) return;
  if(externalTabUpdateNotified) return;
  if(e.newValue===null || e.newValue===savedSnapshot) return;
  externalTabUpdateNotified=true;
  refreshDirtyFlag();
  const suffix = dirty ? '\n\nこのタブには未確定の変更があります。再読み込みすると、その変更は失われます。' : '';
  alert('別のタブでデータが更新されました。最新の内容を表示するため、このページを再読み込みしてください。'+suffix);
});
window.addEventListener('beforeunload', e=>{
  refreshDirtyFlag();
  if(!dirty) return;
  e.preventDefault();
  e.returnValue='';
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeChoices();
  if(e.key==='Enter' && e.target?.id==='tagAddName'){
    e.preventDefault();
    document.getElementById('confirmTagAdd')?.click();
  }
});

function clearDropMarkers(){ $$('.dropBefore,.dropAfter').forEach(x=>x.classList.remove('dropBefore','dropAfter')); }
function dropPosition(row, event){
  const rect=row.getBoundingClientRect();
  return (event.clientY - rect.top) < rect.height/2 ? 'before' : 'after';
}
function dropTargetIndex(row, event){
  const base=Number(row.dataset.index);
  return dropPosition(row,event)==='after' ? base+1 : base;
}
function moveByInsertIndex(kind, payload, insertIndex){
  const fromIndex=payload.index;
  let toIndex=insertIndex;
  if(fromIndex < toIndex) toIndex -= 1;
  if(toIndex===fromIndex) return;
  if(kind==='priority') setPriorityOrder(payload.type, fromIndex, toIndex);
  if(kind==='debut') setDebutOrder(payload.work, fromIndex, toIndex);
  if(kind==='dashboardKpi') setDashboardKpiOrder(fromIndex, toIndex);
}

document.addEventListener('dragstart', e=>{
  const row=e.target.closest('[data-drag-kind]');
  if(!row) return;
  dragPayload={kind:row.dataset.dragKind, type:row.dataset.type || '', work:row.dataset.work || '', index:Number(row.dataset.index)};
  row.classList.add('dragging');
  if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','move'); }
});
document.addEventListener('dragover', e=>{
  const row=e.target.closest('[data-drag-kind]');
  if(!row || !dragPayload) return;
  const same = row.dataset.dragKind===dragPayload.kind && (row.dataset.type||'')===dragPayload.type && (row.dataset.work||'')===dragPayload.work;
  if(!same) return;
  e.preventDefault();
  clearDropMarkers();
  row.classList.add(dropPosition(row,e)==='before' ? 'dropBefore' : 'dropAfter');
});
document.addEventListener('dragleave', e=>{
  if(!e.relatedTarget || !e.target.closest('[data-drag-kind]')?.contains(e.relatedTarget)){
    // markers are refreshed by dragover; keep this conservative to avoid flicker
  }
});
document.addEventListener('drop', e=>{
  const row=e.target.closest('[data-drag-kind]');
  if(!row || !dragPayload) return;
  const same = row.dataset.dragKind===dragPayload.kind && (row.dataset.type||'')===dragPayload.type && (row.dataset.work||'')===dragPayload.work;
  if(!same) return;
  e.preventDefault();
  const payload=dragPayload;
  const insertIndex=dropTargetIndex(row,e);
  dragPayload=null;
  clearDropMarkers();
  moveByInsertIndex(payload.kind, payload, insertIndex);
});
document.addEventListener('dragend', ()=>{
  dragPayload=null;
  $$('.dragging').forEach(x=>x.classList.remove('dragging'));
  clearDropMarkers();
});

initFirebaseCloud();
renderCurrent();
trackAppView(currentView);
if(startupRecovery) setTimeout(openStartupRecoveryModal,0);
</script>
</body>
